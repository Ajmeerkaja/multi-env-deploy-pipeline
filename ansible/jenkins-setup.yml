---
- name: Install Jenkins
  hosts: jenkins_server
  become: yes

  tasks:
    - name: Remove old keyring/list files if present
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/keyrings/jenkins-keyring.asc
        - /etc/apt/sources.list.d/jenkins.list
        - /etc/apt/keyrings/jenkins-keyring.asc

    - name: Ensure /etc/apt/keyrings exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Jenkins GPG key (armored, no dearmor needed)
      get_url:
        url: https://pkg.jenkins.io/debian/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins repository (modern method)
      copy:
        content: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian binary/\n"
        dest: /etc/apt/sources.list.d/jenkins.list
        mode: '0644'

    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: yes

    - name: Install Java 21 (Jenkins requirement)
      apt:
        name: openjdk-21-jre
        state: present

    - name: Ensure Java 21 is the default
      alternatives:
        name: java
        path: /usr/lib/jvm/java-21-openjdk-amd64/bin/java

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes

    - name: Install Docker (Jenkins will need it to build images)
      apt:
        name: docker.io
        state: present

    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins to apply docker group membership
      systemd:
        name: jenkins
        state: restarted